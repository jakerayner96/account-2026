<style>
/* ============================================================
   Account 2026 — one page, every fascia. Built on DS classes:
   .hd (header) · .hd-usp (USP) · .acct-card (balance card) · .acct-row (account row) · .tagpill · .dplus (Deliver+) · .bd (buttons) · .ft (footer) · .acc-h (accordion)
   Figma: Account 2026 2KLlzqIWlDcri8YIHwEd63 (1009:1836 store credit + per-fascia frames, 397:17211 Dec 25 landing = live)
          SEEL Enhancements 2026 CQIe2e2c0iagD1T9WjdYsx 3336:188708 (Unlimited states)
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page-bg,#FAFAFA);color:var(--text-primary);font-family:var(--font-family-base);font-weight:var(--w-regular);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
img{display:block}
:root{--m:16px;--gut:8px}
@media(min-width:1024px){:root{--m:80px}}
[hidden]{display:none!important}

/* ---- header (DS .hd) ---- */
.hd{position:relative;z-index:5}
.hd .desk{display:none}
@media(min-width:1024px){.hd .mob{display:none}.hd .desk{display:block}}
.hd-bar--desktop{--plp-margin:var(--m)}
/* USP — DS USP banner (catalogue 'usp-banner', Figma aIHmkCaTy9c5EWOxAGw0So 11982-37171 / 13005-165658): .usp-strip of .usp-cell,
   .usp-row / .usp-t / .usp-sep (4px dash, line break once wrapped), .usp-cd countdown. New-format sizing = the PLP UI updates prototype
   (12px / 15px leading / 4px padding → 23px row, 44px with a countdown; every message in one strip, rotating on mobile, side by side on desktop).
   That sizing still lives in projects/plp-alignment/plp.html, not components.css — promote it with whichever brief merges first. */
.usp-strip{padding:0;gap:0;overflow:hidden}
.usp-cell{font-size:12px;line-height:15px;min-height:0;padding:4px 16px;font-weight:var(--w-regular);gap:2px;background:var(--usp-a-bg);text-transform:none}
.usp-cell:has(.usp-cd){gap:2px}
.usp-cell b{font-size:12px;line-height:15px;font-weight:var(--w-strong)}
.usp-cd{line-height:17px}
@media(min-width:1024px){.usp-strip{grid-auto-columns:auto;justify-content:center;column-gap:32px}}
@media(max-width:1023px){.usp-strip .usp-cell{min-height:0}.usp-strip .usp-cell.rot-on{animation:usp-fade var(--dur-slow) var(--ease-standard)}} /* DS mobile floor is 56px (old format) */
@keyframes usp-fade{from{opacity:0}to{opacity:1}}

/* ---- page frame ---- */
main{padding:16px var(--m) 32px;max-width:1440px;margin:0 auto}
.blk{margin-bottom:16px}
.blk:empty{display:none}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hello h1{font-size:24px;font-weight:var(--w-strong);line-height:30px;letter-spacing:-.01em}
.hello p{font-size:12px;margin-top:4px;word-break:break-all}
.hello .so{display:none}
@media(min-width:1024px){main{padding-top:32px}.hello .so{display:inline-flex}.signout-m{display:none!important}}

/* balance card (DS .acct-card) — 2026 fills per fascia from Figma; tokens are the fallback */
.acct-card{background:var(--ac-bg,var(--card-bg));color:var(--ac-ink,var(--card-ink));border-radius:var(--ac-r,var(--radius-default));gap:16px;padding:24px 16px}
.acct-card .lbl{color:var(--ac-lbl,inherit);margin-top:-12px}
.acct-card .bd{background:var(--ac-btn,var(--card-btn-bg));color:var(--ac-btn-ink,var(--card-btn-ink))}
.acct-card .amt{font-family:var(--font-family-base)}

/* mobile: card and menu stack with the Figma 16px gap */
.dgrid{display:flex;flex-direction:column;gap:16px}
.hd-logo.wm{font-weight:700;font-size:18px;line-height:20px;letter-spacing:-.02em;max-width:none;height:auto;white-space:nowrap}
/* dark headers (Misspap: --surface-page #000 — red wordmark, white icons, per the Figma frame) */
.hd.dark .hd-icons img,.hd.dark .hd-burger img,.hd.dark .hd-search img{filter:invert(1)}
.hd-logo.mask{display:block;-webkit-mask:var(--lg) left center/contain no-repeat;mask:var(--lg) left center/contain no-repeat;background:var(--lgc);height:18px}
/* rows (DS .acct-row) */
.menu{display:flex;flex-direction:column;gap:8px}
.acct-row{min-height:56px}
.acct-row .lbl{white-space:normal;display:flex;align-items:center;gap:8px}
.acct-row .st{text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.acct-row .dot{background:var(--sd)}
.acct-row .chev{width:16px;height:16px;opacity:.9}
body:not(.chev-on) .acct-row .chev{display:none}
.tagpill{height:20px;padding:0 8px;font-size:10px;text-transform:uppercase;letter-spacing:.02em}
.tagpill--n{width:20px;padding:0}

/* desktop tile grid */
@media(min-width:1024px){
  .dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .dgrid.has-card{grid-template-columns:minmax(220px,1.05fr) repeat(4,1fr)}
  .dgrid .acct-card{grid-row:span 2;justify-content:center;margin:0}
  .dgrid .menu{display:contents}
  /* tile: icon top-left; label bottom-left with the status on the same line, right-aligned (Figma 1970:205) */
  .dgrid .acct-row{display:grid;grid-template-columns:1fr auto;grid-template-rows:1fr auto;align-items:end;column-gap:12px;row-gap:24px;min-height:143px;padding:32px 24px 32px}
  .dgrid .acct-row img:first-child{width:40px;height:40px;grid-column:1/-1;grid-row:1;align-self:start}
  .dgrid .acct-row .lbl{flex:none;font-size:18px;grid-column:1;grid-row:2}
  .dgrid .acct-row .chev{display:none}
  .dgrid .acct-row .st{grid-column:2;grid-row:2;align-self:center;margin:0}
  .dgrid.has-card .acct-row{min-height:0;padding:24px 20px;gap:20px}
  .dgrid.has-card .acct-row img:first-child{width:32px;height:32px}
  .dgrid.has-card .acct-row .lbl{font-size:14px}
}
.signout-m{display:flex;justify-content:center;margin:16px 0 8px}
.bd.so-btn{background:var(--panel-bg,#FFF);border:1px solid var(--border-subtle);color:var(--text-primary);text-transform:none;font-weight:var(--w-regular);font-size:16px;line-height:24px;padding:4px 28px}

/* Beauty Club — live (Dec 25) progress card · new (SEEL) rewards balance */
.beauty{background:var(--panel-bg,#FFF);border-radius:var(--radius-default);padding:16px;display:flex;flex-direction:column;gap:12px}
.beauty .h{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:var(--w-mid)}
.beauty .h img{width:20px;height:20px}
.beauty .bar{height:6px;border-radius:99px;background:var(--surface-media)}
.beauty .bar i{display:block;height:100%;width:62%;border-radius:inherit;background:var(--surface-action)}
.beauty .bd{width:100%}
.beauty--new{background:#1A1A1A;color:#FFF;flex-direction:row;align-items:center;justify-content:space-between}
.beauty--new .v{font-size:28px;font-weight:var(--w-strong);line-height:1}
.beauty--new .v small{font-size:18px}
.beauty--new .l{font-size:12px;color:#FFD0B1;margin-top:4px}
.beauty--new .bd{width:auto;background:#FFF;color:#000;text-transform:none;font-weight:var(--w-regular);font-size:14px;padding:8px 14px;line-height:20px}

/* Deliver+ (DS .dplus, SEEL account banner copy) */
.dplus{min-width:0;width:100%}
.dplus .dpl{display:none}
.dplus .dpl.show{display:block;max-width:100%;height:auto!important}
.dplus p{font-size:12px;line-height:1.35}
.dplus .h b{font-weight:var(--w-strong)}

/* balance page */
.back{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:var(--w-mid);margin-bottom:16px}
.back img{width:16px;height:16px} /* back chevron: DS icons-left at 16×16, 1pt line (Jake, 08 Oct) */
.tx{display:flex;flex-direction:column}
.tx .r{display:flex;justify-content:space-between;align-items:flex-end;padding:12px 16px;background:var(--panel-bg,#FFF)}
.tx .r:nth-child(even){background:var(--surface-media)}
.tx .d{font-size:10px;color:var(--text-secondary);margin-bottom:4px}
.tx b{font-weight:var(--w-strong);font-size:14px;display:block}
.tx .o{font-size:12px}
.tx .a{font-size:12px;font-weight:var(--w-strong)}
.tx .a.neg{color:var(--text-secondary)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:56px 16px;font-size:12px;color:var(--text-secondary)}
.empty img{width:24px;height:24px;opacity:.7}
.bal-desk{display:block}
.bal-side{display:none}
@media(min-width:1024px){
  .bal-desk{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
  .bal-side{display:flex;flex-direction:column;gap:16px}
  .bal-side .acct-card{margin:0}
  .bal-side .menu{gap:0}
  .bal-side .acct-row{background:none;min-height:44px;padding:10px 12px;font-size:14px}
  .bal-side .acct-row .lbl{font-size:14px}
  .bal-side .acct-row.cur{background:var(--surface-media)}
  .bal-desk>.mobcard{display:none}
  .back{display:none}
}

/* ---- account sub-pages: mobile back header; desktop side menu one level deep (live /account/unlimited, 08 Oct 2026) ---- */
.sub .side{display:none}
.subc{min-width:0}
@media(min-width:1024px){
  .sub{display:grid;grid-template-columns:270px minmax(0,1fr);gap:48px;align-items:start}
  .sub .side{display:block}
  .sub .side .hello{margin-bottom:24px}
  .sub .side .menu{gap:0}
  .sub .side .acct-row{background:none;border-radius:0;min-height:0;padding:12px;border-bottom:1px solid var(--border-subtle);gap:12px}
  .sub .side .acct-row img:first-child{width:24px;height:24px}
  .sub .side .acct-row .lbl{font-size:16px}
  .sub .side .acct-row .st{display:none}
  .sub .side .acct-row.cur{background:var(--surface-media);box-shadow:inset 4px 0 0 var(--surface-action);font-weight:var(--w-strong)}
  .sub .back{display:none}
  .subc .acct-card{max-width:374px}
}
/* membership page (live: logo band + body; member = ACTIVE + membership / expiry) */
.mbox{background:var(--panel-bg,#FFF);width:100%} /* no outline · full width to the margins (Jake, 08 Oct) */
.mbox .band{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:50px;background:var(--mb-bg,#DCDCDC) center/cover no-repeat;color:var(--mb-ink,#000)}
.mbox .band>span:first-child{min-width:0;flex:0 1 auto} /* the logo gives way, the status never moves off-screen */
.mbox .band img{height:var(--mb-h,40px);width:auto;max-width:100%;object-fit:contain;object-position:left center}
.mbox .band .plus{font-size:28px;font-weight:var(--w-strong);line-height:1;margin-left:-6px}
.mbox .band .on{font-size:14px;font-weight:var(--w-strong);text-transform:uppercase;white-space:nowrap;flex:none}
.mbox .band b.nm{font-size:22px;font-weight:var(--w-strong);text-transform:uppercase}
.mbox .bodyx{padding:24px 24px 28px;display:flex;flex-direction:column;gap:16px;font-size:14px} /* live member view: 14px light labels, bold values, dark 12px note */
.mbox .kv{display:flex;gap:8px;align-items:baseline;padding-bottom:16px;border-bottom:1px solid var(--border-subtle);font-weight:300}
.mbox .kv:last-of-type{border-bottom:none;padding-bottom:0}
.mbox .kv b{font-weight:600}
.mbox .ctas{display:flex;flex-direction:column;gap:8px} /* Add + Find out more: 8px apart (Jake, 08 Oct) */
.mbox .note{font-size:12px;line-height:18px;color:var(--acct-ink);font-weight:300}
/* ---- app (Figma Account 2026 · App / Account / Landing 1296:69086) ---- */
body.app .hd,body.app .ft{display:none}
body.app{background:#FFF}
[data-brand="plt"] body.app{background:#FAF5E7} /* PLT app page is cream (Account 2026 1292:10945) */
body.app main{padding:0 16px 120px;min-height:100vh}
.app-sb{display:flex;justify-content:space-between;align-items:center;height:47px;padding:0 14px 0 32px;font:600 17px/1 -apple-system,'SF Pro Text',system-ui,sans-serif;margin:0 -16px}
.app-sb svg{display:block}
.app-title{position:relative;text-align:center;font-size:18px;font-weight:var(--w-strong);line-height:24px;padding:14px 32px 18px}
.app-title .bk{position:absolute;left:0;top:10px;width:32px;height:32px;display:grid;place-items:center;padding:0}
.app-title .bk img{width:16px;height:16px}
body.app .dgrid{gap:12px}
body.app .menu{gap:0}
body.app .acct-row{background:none;border-radius:0;border-bottom:1px solid var(--border-subtle);padding:16px 4px;gap:24px}
body.app .acct-row .chev{display:block!important;width:20px;height:20px}
body.app .signout-m .bd.so-btn{background:var(--surface-media);border-color:transparent;font-size:14px;padding:8px 16px}
/* app tab bar = DS .app-tabbar (components.css; catalogue 'app-tabbar') — pinned to the bottom of the phone viewport */
body.app .app-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20}

.ft{margin-top:0}
.ft-news{text-align:center;justify-items:center}
.ft-news h3{font-size:24px;line-height:1.2}
.ft-news p{margin:0 auto}
.ft-sub{flex-direction:column;width:100%;max-width:520px}
.ft-sub input{flex:none;height:50px}

.ft-h{font-size:14px;font-weight:var(--w-strong);text-align:center;margin:24px 0 10px}
.ft-soc{display:flex;gap:18px;justify-content:center}
.ft-soc img{width:22px;height:22px}
.ft-brands{gap:18px 22px;border-top:none}

.ft-cols{display:none}

  .ft-news p{margin:0}
  .ft-sub{flex-direction:row;max-width:none}
  .ft-sub input{flex:1}
  .ft-legal{text-align:center}
  .ft-acc,.ft-mob{display:none}
  .ft-cols{display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;padding:40px var(--m);border-bottom:1px solid var(--border-subtle);margin:0 var(--m);padding-left:0;padding-right:0}
  .ft-col a{font-size:12px;padding:4px 0}
  .ft-col h4{font-size:12px}
  .ft-soc{justify-content:flex-start}
  .ft-apps{justify-content:flex-start;padding:0}
}
.ft-apps img{height:36px}

/* ---- live colour match (signed-in computed styles, all UK fascias, 08 Oct 2026) ----
   page #FAFAFA · rows/tiles #FFF · text #000 · Sign Out #FFF + 1px #E7E7E7 (desktop #E5E7EB) · newsletter band #F8F8F8 · greeting 24/600
   PLT: page #FAF5E7 · rows #FFFDF7 · text #333 · band #FAF5E7 · greeting 16/400 · square. Desktop tiles: 8px radius (0 where the brand is square). */

body,.acct-row,.bd.so-btn,.hello h1,.hello p,.tx,.mbox{color:var(--acct-ink)}
.ft-news{background:var(--acct-band)}
.hello h1{font-weight:600}
[data-brand="plt"] .hello h1{font-size:16px;font-weight:400;line-height:24px}
.bd.so-btn{border-color:var(--acct-so-b)}
@media(min-width:1024px){
  .dgrid .acct-row{border-radius:calc(var(--radius-default) * 2)}
  .hello .so{border-color:#E5E7EB}
  [data-brand="plt"] .hello .so{border-color:#E5E7EB}

/* configurator focus ring */
.focus{outline:2px solid #0D99FF;outline-offset:3px;transition:outline-color .6s}
</style>

        `<div class="tx">${TX.map(([d,t,o,a])=>`<div class="r"><div><div class="d">${d}</div><b>${t}</b>${o?`<span class="o">${o}</span>`:''}</div><span class="a${a<0?' neg':''}">${a<0?'-':'+'} £${Math.abs(a).toFixed(2)}</span></div>`).join('')}</div>`);
      S.balance=saved;
    }
    html+=S.app?appTitle(title,true):`<button class="back" data-go="landing"><img src="${LIB}/icons-left.svg" alt="">${esc(title)}</button>`;
    const sideHello=`<div class="hello"><div><h1>Good Morning, ${esc(S.name||'Jake')}</h1><p>${esc(S.email)}</p></div></div>`;
    html+=`<div class="sub"><aside class="side">${sideHello}${menuHTML(f,unl?'member':'balance')}</aside><div class="subc">${content}</div></div>`;
  }
  if(S.app)html+=appTabs();
  $('#main').innerHTML=html;

  // footer
  let ft='';
  if(on('news')) ft+=`<div class="ft-news" data-el="news"><div><h3>${f.news||'Let’s Get To Know Each Other'}</h3><p>Sign up to receive emails from us, so you never miss out on the good stuff.</p></div><div><div class="ft-sub"><input type="email" placeholder="Please enter your email address" aria-label="Email address"><button class="bd pri">Subscribe</button></div><p class="ft-legal">By submitting your details, you agree to receive marketing communications from ${f.dom.replace(/^./,ch=>ch.toUpperCase())} by email. You can unsubscribe at any point. You also consent to the use of your details in accordance with our <u>Privacy Policy</u>.</p></div></div>`;
  if(on('footer')){
    const pay=['visa','mastercard','amex','maestro','visa-electron','apple-pay','payplus','paypal','klarna','clearpay','google-pay'];
    const soc=['social-instagram','social-pintrest','social-facebook','social-x','you-tube','social-tik-tok'].map(s=>`<img src="${LIB}/${s}.svg" alt="">`).join('');
    const apps=`<div class="ft-apps"><img src="${AST}/ds/icons/apps/google-play.png" alt="Get it on Google Play"><img src="${AST}/ds/icons/apps/app-store.svg" alt="Download on the App Store"></div>`;
    const links=[['Unlimited Delivery','Rewards','Student Discount','Gift Cards'],['Return Your Order','Frequently Asked Questions','Delivery Information','Returns Information','Contact Us'],['Privacy Policy','Terms & Conditions','About Cookies','Terms of Use'],['Careers','Modern Slavery Statement','Site Map']];
    ft+=`<div data-el="footer">`;
    if(f.brands) ft+=`<div class="ft-brands ft-mob">${f.brands.map(x=>`<img src="${AST}/brands/${x}.svg" alt="${x}">`).join('')}</div>`;
    ft+=`<div class="ft-pay ft-mob">${pay.map(p=>`<img src="${AST}/ds/icons/pay/${p}.png" alt="${p}">`).join('')}</div>`;
    ft+=`<div class="ft-acc">${f.ft.slice(0,4).map(a=>`<button class="acc-h">${a}<img src="${LIB}/icons-down.svg" alt=""></button>`).join('')}</div>`;
    ft+=`<div class="ft-mob"><div class="ft-h">Download our app</div>${apps.replace('ft-apps','ft-apps" style="justify-content:center;padding:0')}<div class="ft-h">Follow us on social media</div><div class="ft-soc">${soc}</div></div>`;
    ft+=`<div class="ft-cols">${f.ft.slice(0,4).map((h,i)=>`<div class="ft-col"><h4>${h}</h4>${links[i].map(l=>`<a href="#">${l}</a>`).join('')}</div>`).join('')}<div class="ft-col"><h4>Follow us on social media</h4><div class="ft-soc" style="margin-bottom:20px">${soc}</div><h4>Download our app</h4>${apps}</div></div>`;
    ft+=`<div class="ft-base"><img src="${AST}/brands/${b}.svg" alt="${f.name}" onerror="this.outerHTML='<b style=&quot;font-size:22px&quot;>${f.name}</b>'"><small>Copyright © 2026 ${f.name}</small></div></div>`;
  }
  $('#ft').innerHTML=ft;
  report();
}

/* ---- DS USP banner helpers — same as projects/plp-alignment/plp.html ---- */
// new-format copy rules: no asterisks, sentence case (brand initialisms kept), 'Use Code' → 'Code:', code value strong and uppercase
const USP_KEEP=['MAN','PLT','UK','NDD','DSGN','DEBENHAMS'];
function uspTidy(t){
  let s=String(t).replace(/<[^>]+>/g,'').replace(/\*/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  s=s.charAt(0).toUpperCase()+s.slice(1);
  USP_KEEP.forEach(k=>{s=s.replace(new RegExp('\\b'+k.toLowerCase()+'\\b','g'),k==='DEBENHAMS'?'Debenhams':k)});
  s=s.replace(/\b(?:use\s+)?code:?\s*([a-z0-9]+)/i,(m,c)=>'Code: <b>'+c.toUpperCase()+'</b>');
  return s;
}
function uspCdMarkup(v){return '<span class="usp-cd">'+v.split(':').map((d,i)=>(i?'<i>:</i>':'')+'<b>'+d+'</b>').join('')+'</span>'}
function uspNewParts(text,sub){
  let row=String(text).split(' | ').map(x=>'<span class="usp-t">'+uspTidy(x)+'</span>').join('<span class="usp-sep"></span>'),cd='';
  if(sub){const sv=String(sub).trim();
    if(/^[\d:]+$/.test(sv))cd=uspCdMarkup(sv);
    else row+='<span class="usp-sep"></span><span class="usp-t">'+uspTidy(sv)+'</span>';
  }
  return '<span class="usp-row">'+row+'</span>'+cd;
}
// the dash exists only while its sections share a line — once they split it becomes a full-width breaker
function uspSepWrap(){document.querySelectorAll('.usp-row').forEach(r=>{const kids=[...r.children];kids.forEach(el=>el.classList.remove('wrapbr'));kids.forEach((el,i)=>{if(!el.classList.contains('usp-sep'))return;const prev=kids[i-1],next=kids[i+1];if(prev&&next&&Math.abs(prev.offsetTop-next.offsetTop)>=4)el.classList.add('wrapbr');});});}
// mobile rotation must not breathe: lock every cell to the tallest message
function syncUspH(){
  const strip=document.getElementById('uspstrip');const cells=strip?[...strip.querySelectorAll('.usp-cell')]:[];
  cells.forEach(c=>c.style.minHeight='');
  if(!cells.length||!matchMedia('(max-width:1023px)').matches)return;
  const probe=strip.cloneNode(false);probe.style.cssText='position:absolute;left:-9999px;top:0;width:'+strip.offsetWidth+'px;visibility:hidden;display:grid';
  cells.forEach(c=>{const k=c.cloneNode(true);k.classList.add('rot-on');probe.appendChild(k)});
  document.body.appendChild(probe);const h=Math.max(0,...[...probe.children].map(c=>c.offsetHeight));probe.remove();
  cells.forEach(c=>c.style.minHeight=h+'px');
}
// mobile USP rotation — one cell at a time, crossfade in place
let rotI=0;
setInterval(()=>{const cells=[...document.querySelectorAll('#uspstrip .usp-cell')];if(cells.length<2||!matchMedia('(max-width:1023px)').matches)return;rotI=(rotI+1)%cells.length;cells.forEach((c,i)=>c.classList.toggle('rot-on',i===rotI));},4000);

// page navigation inside the prototype
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;S.page=g.dataset.go==='balance'?(parseFloat(S.balance)>0?'balance':'empty'):g.dataset.go;render();parent!==window&&parent.postMessage({acctPage:S.page},'*');window.scrollTo(0,0);});

function report(){
  if(parent===window)return;
  const f=F[S.brand];
  parent.postMessage({acctReady:1,
    blocks:ordered('blocks',BLOCKS).map(x=>({id:x.id,label:x.label,on:isOn('blocks',x,f),def:!!x.def(S.mode,f)})),
    rows:ordered('rows',ROWS).map(x=>({id:x.id,label:x.id==='member'?(f.member||'Unlimited')+' (membership)':(S.mode==='live'&&x.live?x.live:x.label),on:isOn('rows',x,f),def:!!x.def(S.mode,f)})),
    statusStyle:statusStyle(),member:f.member},'*');
}
addEventListener('message',e=>{const d=e.data;if(!d||!d.acctSet)return;S=Object.assign(S,d.state);render();
  if(d.focus){const el=document.querySelector(`[data-el="${d.focus}"]`);if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('focus');setTimeout(()=>el.classList.remove('focus'),900);}}});
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(render,120);});
